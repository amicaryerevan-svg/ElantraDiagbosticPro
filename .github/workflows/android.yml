
name: Build Elantra APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35'

      - name: Build APK
        run: gradle clean :app:assembleDebug

      - name: Check APK signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose --print-certs "$APK"

      - name: Check APK information
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$APK" | head -n 20
          sha256sum "$APK"

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Elantra-Diagnostic-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
